<svg width="520" height="120" viewBox="0 0 520 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>UseCalcGrid</title>
  <desc>UseCalcGrid logo</desc>

  <!-- Icon -->
  <rect x="8" y="8" width="104" height="104" rx="24" fill="#111827"/>

  <!-- Calculation grid -->
  <rect x="30" y="30" width="60" height="60" rx="10" stroke="#FFFFFF" stroke-width="6"/>

  <path d="M50 30V90M70 30V90M30 50H90M30 70H90"
        stroke="#FFFFFF"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Accent calculation mark -->
  <path d="M45 42L57 54L45 66"
        stroke="#22C55E"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <circle cx="77" cy="78" r="5" fill="#22C55E"/>

  <!-- Wordmark -->
  <text x="136" y="75"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="700"
        letter-spacing="-1.5"
        fill="#111827">
    UseCalc<tspan fill="#16A34A">Grid</tspan>
  </text>
</svg>
